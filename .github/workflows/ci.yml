name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: exam_sys_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exam_sys_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: exam_sys_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MAINTENANCE_HOST: localhost
      POSTGRES_MAINTENANCE_PORT: "5432"
      POSTGRES_MAINTENANCE_DB: postgres
      POSTGRES_MAINTENANCE_USER: postgres
      POSTGRES_MAINTENANCE_PASSWORD: postgres
      POSTGRES_SSLMODE: prefer
      POSTGRES_CONNECT_TIMEOUT: "3"
      ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check PostgreSQL test DB target
        run: python database/postgres/scripts/check_test_db_target.py

      - name: Run backend PostgreSQL runtime smoke
        env:
          EXAM_SYS_NEXT_DB_HEALTH_INTEGRATION: "1"
        run: python -m pytest backend/tests/test_backend_runtime_postgres_smoke.py -q

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --run

  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: exam_sys_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exam_sys_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: exam_sys_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MAINTENANCE_HOST: localhost
      POSTGRES_MAINTENANCE_PORT: "5432"
      POSTGRES_MAINTENANCE_DB: postgres
      POSTGRES_MAINTENANCE_USER: postgres
      POSTGRES_MAINTENANCE_PASSWORD: postgres
      POSTGRES_SSLMODE: prefer
      POSTGRES_CONNECT_TIMEOUT: "3"
      EXAM_SYS_NEXT_ENV: test
      ENVIRONMENT: test
      VITE_API_BASE_URL: http://127.0.0.1:8001
      API_BASE_URL: http://127.0.0.1:8001
      FRONTEND_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        run: |
          python database/postgres/scripts/check_test_db_target.py
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > backend-e2e.log 2>&1 &

      - name: Start frontend preview
        working-directory: frontend
        run: npm run preview -- --host 127.0.0.1 --port 4173 > ../frontend-e2e.log 2>&1 &

      - name: Wait for backend and frontend
        run: |
          python - <<'PY'
          import sys
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          urls = [
              "http://127.0.0.1:8001/api/v1/health",
              "http://127.0.0.1:4173/login",
          ]
          deadline = time.time() + 90
          pending = set(urls)

          while time.time() < deadline and pending:
              for url in list(pending):
                  try:
                      with urlopen(url, timeout=3) as response:
                          if 200 <= response.status < 500:
                              pending.remove(url)
                  except URLError:
                      pass
              if pending:
                  time.sleep(1)

          if pending:
              raise SystemExit(f"Timed out waiting for: {', '.join(sorted(pending))}")
          PY

      - name: Run frontend E2E smoke
        working-directory: frontend
        run: npx playwright test e2e/frontend-backend-smoke.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  worker-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/worker
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: exam_sys_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MAINTENANCE_HOST: localhost
      POSTGRES_MAINTENANCE_PORT: "5432"
      POSTGRES_MAINTENANCE_DB: postgres
      POSTGRES_MAINTENANCE_USER: postgres
      POSTGRES_MAINTENANCE_PASSWORD: postgres
      POSTGRES_SSLMODE: prefer
      POSTGRES_CONNECT_TIMEOUT: "3"
      ENVIRONMENT: test
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: exam_sys_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exam_sys_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements-dev.txt

      - name: Check PostgreSQL test DB target
        run: python database/postgres/scripts/check_test_db_target.py

      - name: Run worker PostgreSQL runtime smoke
        env:
          EXAM_SYS_NEXT_DB_HEALTH_INTEGRATION: "1"
        run: python -m pytest -c worker/pytest.ini worker/tests/test_worker_postgres_runtime_smoke.py -q

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Prepare PostgreSQL schema for core chain smoke
        shell: bash
        run: |
          TEMP_ENV="$RUNNER_TEMP/exam_sys_test.env"
          trap 'rm -f "$TEMP_ENV"' EXIT
          cat > "$TEMP_ENV" <<'EOF'
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=exam_sys_test
          DB_MAINTENANCE_DATABASE=postgres
          DB_SSLMODE=prefer
          POSTGRES_DB=exam_sys_test
          EOF
          python database/postgres/scripts/check_test_db_target.py
          bash database/postgres/scripts/run_all_migrations.sh "$TEMP_ENV"

      - name: Run core submission-processing chain smoke
        env:
          EXAM_SYS_NEXT_DB_HEALTH_INTEGRATION: "1"
        run: python -m pytest -c worker/pytest.ini worker/tests/test_core_submission_processing_chain_postgres_integration.py -q

      - name: Run worker tests
        run: python -m pytest worker/tests -q

  docs-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run docs checks
        run: |
          python tools/docs/check_project_readiness.py
          python tools/docs/check_docs_routing.py
          python tools/docs/check_legacy_boundaries.py
