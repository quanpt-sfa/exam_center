services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: exam_sys_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_sys_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: python:3.12-slim
    working_dir: /workspace/backend
    environment:
      ENVIRONMENT: development
      EXAM_SYS_NEXT_CORS_ALLOWED_ORIGINS: http://localhost:5173
      EXAM_SYS_NEXT_ACCESS_TOKEN_SECRET: dev-only-change-me
      EXAM_SYS_NEXT_REFRESH_TOKEN_SECRET: dev-only-change-me
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: exam_sys_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PYTHONPATH: /workspace/backend
    command:
      - sh
      - -lc
      - pip install --no-cache-dir -r requirements-dev.txt && python -m uvicorn app.main:app --host 0.0.0.0 --port 8001
    volumes:
      - .:/workspace
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /workspace/frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8001
    command:
      - sh
      - -lc
      - npm ci && npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_dev_data:
